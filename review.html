<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Received</title>

<link rel="stylesheet" href="styles/form.css">
<script src="scripts/review.js" defer></script>
</head>

<body>

<header>
    <h1>Thank You For Sharing Your Review</h1>
</header>

<main class="confirmation">

    <h2>Your feedback has been received!</h2>

    <p>
        We appreciate you taking the time to share your experience.
    </p>

    <p>
        Reviews completed:
        <strong id="reviewCount"></strong>
    </p>

</main>

<footer>
    <p>
        &copy;
        <span id="currentyear"></span>
        | Yavich Corneille Soundat Loemba
        | Congo-Brazzaville
    </p>

    <p id="lastModified"></p>
</footer>

<script>
document.querySelector("#currentyear").textContent =
new Date().getFullYear();

document.querySelector("#lastModified").textContent =
`Last Modified: ${document.lastModified}`;
</script>

</body>
</html>
